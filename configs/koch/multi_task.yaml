# @package _global_

defaults:
  - _self_

# tentatively unused
offline_training:
  offline_h5_path: "data/real_robot/updated_trajs/usc_koch_rewind_full_{0}_{1}.h5"
  reward_at_every_step: false
  offline_tasks: null

environment:
  cfg_name: "koch_single_task"
  # text_instruction: "separate the orange and blue cups" # seen task
  text_instruction: "open the red trash bin"
  # text_instruction: "Put the blue cup in the box"
  # text_instruction: "separate the red and green cups" # unseen task
  # text_instruction: "Separate the blue and red cups"
  n_envs: 1
  train_freq_num: 1
  train_freq_type: 'episode'
  ignore_language: false
  image_keys: ['observation.images.main', 'observation.images.side']
  max_episode_steps: 250
  use_proprio: true

online_training:
  total_time_steps: 50000
  gradient_steps: 125

general_training:
  gamma: 0.99 # gamma should be (1/(1-gamma) = 250 steps

# Reward divisor is environment-dependent
reward_model:
  reward_divisor: 1.0