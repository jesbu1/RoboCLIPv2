# @package _global_

defaults:
  - _self_

# tentatively unused
offline_training:
  offline_h5_path: "data/real_robot/updated_trajs/usc_koch_rewind_{0}_{1}.h5"
  reward_at_every_step: false
  offline_tasks: ["fold the blue towel"]

environment:
  cfg_name: "koch_single_task"
  text_instruction: "fold the blue towel" # seen task
  # text_instruction: "separate the red and green cups" # unseen task
  n_envs: 1
  train_freq_num: 1
  train_freq_type: 'step'
  ignore_language: false
  image_keys: ['observation.images.main', 'observation.images.side']
  max_episode_steps: 300
  use_proprio: true

online_training:
  gradient_steps: 1

general_training:
  # gamma: 0.996 # gamma should be (1/(1-gamma) = 250 steps
  gamma: 0.99 # gamma should be (1/(1-gamma) = 250 steps

# Reward divisor is environment-dependent
reward_model:
  reward_divisor: 1.0