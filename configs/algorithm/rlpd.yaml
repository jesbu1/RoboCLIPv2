# @package _global_

defaults:
  - _self_

# Because RLPD is slower, we will log more frequently
logging:
  eval_freq: 1500
  video_freq: 1500

general_training:
  algo: rlpd
  action_noise: 0 # sigma
  sparse_only: true
  learning_rate: 1e-3

  # offline rl parameters
  critic_update_ratio: 4 # iql and cql
  n_critics: 10
  n_critics_to_sample: 2

  # RLPD-specific parameters
  rlpd_train_critic_with_entropy: false
  rlpd_offline_algo: iql

model:
  policy_layer_norm: false
  critic_layer_norm: true
  pi_net_arch: [512, 512]
  qf_net_arch: [512, 512, 256]

offline_training:
  offline_training_steps: 5000 # runs BC, only doing 1 for now for checking

online_training:
  total_time_steps: 50000
  mix_buffers: true

environment:
  is_state_based: true # TODO: this is temporary
