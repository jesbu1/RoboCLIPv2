# @package _global_

defaults:
  - _self_

# Because RLPD is slower, we will log more frequently
logging:
  eval_freq: 1500
  video_freq: 1500

general_training:
  algo: rlpd
  action_noise: 0 # sigma
  learning_rate: 1e-3

  # offline rl parameters
  n_critics: 3
  n_critics_to_sample: 2

  # RLPD-specific parameters
  rlpd_train_critic_with_entropy: false
  rlpd_offline_algo: iql

model:
  policy_layer_norm: true
  critic_layer_norm: true
  pi_net_arch: [768, 512]
  qf_net_arch: [768, 768, 512]

offline_training:
  offline_training_steps: 20000
  ckpt_path: null  # Path to load checkpoint from, if provided will skip offline training
  critic_update_ratio: 1

online_training:
  total_time_steps: 50000
  mix_buffers: true
  warm_start_online_rl: true
  learning_starts: 200
  critic_update_ratio: 4 
