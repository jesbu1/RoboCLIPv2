# @package _global_

defaults:
  - _self_

logging:
  eval_freq: 5000
  video_freq: 10000

general_training:
  algo: sac
  name: sac
  action_noise: 0.1 # sigma
  learning_rate: 1e-3


model:
  policy_layer_norm: true
  critic_layer_norm: true
  pi_net_arch: [768, 512, 256]
  qf_net_arch: [768, 512, 512]
  
offline_training:
  offline_training_steps: 0 # SAC is online-only

online_training:
  total_time_steps: 500000