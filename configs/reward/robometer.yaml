# @package _global_

general_training:
  dense_rewards_at_end: false
  learning_rate: 1e-3
  entropy_term: "auto"
  normalize_reward: false
  terminate_on_success: true

reward_model:
  name: 'robometer'
  model_path: 'aliangdw/Robometer-4B'
  batch_size: 1
  success_bonus: 200
  reward_divisor: 1
  reward_at_every_step: true
  sum_reward: false
  use_progress_diff: false
  diff_gamma: 1.0

  # Robometer-specific
  max_frames: 4
  use_server: false
  server_url: 'http://localhost:8000'
