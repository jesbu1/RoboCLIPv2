# @package _global_

defaults:
  - _self_

offline_training:
  offline_h5_path: "data/h5_buffers/updated_trajs/metaworld_traj_15_demos_{}.h5"
  offline_tasks: ['door-close-v2', 'drawer-close-v2', 'button-press-wall-v2', 'window-open-v2', 
                  'handle-press-side-v2', 'coffee-push-v2', 'faucet-close-v2', 'stick-pull-v2', 
                  'sweep-into-v2', 'push-back-v2']

environment:
  cfg_name: "metaworld_off_on_15"
  n_envs: 1
  train_freq_num: 1
  train_freq_type: 'step'
  env_id: "button-press-topdown-v2" # eval task
  ignore_language: false

# Reward divisor is environment-dependent
reward_model:
  reward_divisor: 1.0