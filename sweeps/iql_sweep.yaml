program: test_scripts/test_iql.py
name: iql_sweep_15_demos_sparse
method: bayes
metric:
  goal: maximize
  name: eval/mean_reward
parameters:
  algorithm:
    values: ["iql"] 
  metaworld:
    values: ["all_tasks_15"] 
  general_training.policy_extraction:
    values: ['awr']
  general_training.awr_advantage_temp:
    values: [0.5, 1.0, 5.0, 10.0]
  general_training.learning_rate:
    values: [1e-4, 1e-3]
  general_training.critic_update_ratio:
    values: [1, 2, 4]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}